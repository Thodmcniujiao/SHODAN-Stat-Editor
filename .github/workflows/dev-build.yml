# SHODAN Stat Editor Offline: the development build. Every push to dev is built (LuaJIT at the commit the
# releases use, libsodium's official build) and published as the "Development build" pre-release (tag: dev),
# which SSEO follows with Settings > Update channel > Every commit. Pushes to ci/* branches only build (the zip
# is kept as the run's artifact). Releases are not touched: the updater's Releases channel skips pre-releases.
name: Development build

on:
  workflow_dispatch:
  push:
    branches: [dev, 'ci/**']

permissions:
  contents: write

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

env:
  LUAJIT_COMMIT: a4c064539ea931274d407e1249b4bb575424a0f4
  # Fixed point release; the archive signature was verified using the official Minisign key.
  LIBSODIUM_URL: https://download.libsodium.org/libsodium/releases/libsodium-1.0.22-msvc.zip
  LIBSODIUM_ZIP_SHA256: 3E03A726FAC4BC09CB61D8F29D658EF7A5ECA0811DE59082130414F7CA2E4279
  LIBSODIUM_DLL_SHA256: F656AEB789BFC3A2AC587FAE1D7CFE278BBE8CE73F28DA73B4D08282EA8F9FE3

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get LuaJIT and libsodium
        shell: pwsh
        run: |
          git clone --quiet https://github.com/LuaJIT/LuaJIT.git "$env:RUNNER_TEMP\LuaJIT"
          git -C "$env:RUNNER_TEMP\LuaJIT" checkout --quiet $env:LUAJIT_COMMIT
          Invoke-WebRequest $env:LIBSODIUM_URL -OutFile "$env:RUNNER_TEMP\sodium.zip"
          $archiveHash = (Get-FileHash "$env:RUNNER_TEMP\sodium.zip" -Algorithm SHA256).Hash
          if ($archiveHash -ne $env:LIBSODIUM_ZIP_SHA256) { throw "libsodium archive checksum differs: $archiveHash" }
          Expand-Archive "$env:RUNNER_TEMP\sodium.zip" "$env:RUNNER_TEMP\sodium"
          New-Item -ItemType Directory -Force offline\runtime | Out-Null
          Copy-Item "$env:RUNNER_TEMP\sodium\libsodium\x64\Release\v143\dynamic\libsodium.dll" offline\runtime\
          $hash = (Get-FileHash offline\runtime\libsodium.dll -Algorithm SHA256).Hash
          if ($hash -ne $env:LIBSODIUM_DLL_SHA256) { throw "libsodium.dll is not the build the releases ship: $hash" }

      - name: Build LuaJIT, the launcher and shodan_hash.dll
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          rem the debug record names the .pdb only (no build folder path in the DLL)
          set "LINK=/PDBALTPATH:%%_PDB%%"
          cd /d "%RUNNER_TEMP%\LuaJIT\src"
          rem msvcbuild runs the tools it builds from its own folder
          set NoDefaultCurrentDirectoryInExePath=
          set "PATH=.;%PATH%"
          call "%CD%\msvcbuild.bat" || exit /b 1
          set "LINK="
          copy /y lua51.dll "%GITHUB_WORKSPACE%\offline\runtime\" || exit /b 1
          set "LJ=%RUNNER_TEMP%\LuaJIT\src"
          call "%GITHUB_WORKSPACE%\offline\launcher\build.bat"
          if not exist "%GITHUB_WORKSPACE%\offline\launcher\SHODAN Stat Editor Offline.exe" exit /b 1
          if not exist "%GITHUB_WORKSPACE%\offline\launcher\shodan_hash.dll" exit /b 1

      - name: Check source and portable data regressions
        shell: pwsh
        run: |
          $tests = @('check_syntax', 'test_numeric_policy', 'test_field_baselines',
            'test_weapon_component_groups', 'test_parameter_preferences', 'test_config_migration',
            'test_portable_data', 'test_portable_save', 'test_startup_failure', 'test_galactic_effects', 'test_planet_effects', 'test_proxy_close', 'test_steam_launch_options', 'test_steam_integration', 'test_steam_restart')
          foreach ($test in $tests) {
            $work = Join-Path $env:RUNNER_TEMP "shodan-tests/$test"
            python tests/run_lua.py "tests/$test.lua" --work $work --isolated-profile
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
          python -m unittest discover -s tests -p test_galactic_effect_proxy.py
          if ($LASTEXITCODE -ne 0) { throw 'Effect proxy tests failed' }
          python -m unittest discover -s tests -p test_planet_effect_proxy.py
          if ($LASTEXITCODE -ne 0) { throw 'Planet assignment proxy tests failed' }
          python -m unittest discover -s tests -p test_proxy_tls.py
          if ($LASTEXITCODE -ne 0) { throw 'Proxy TLS tests failed' }
          python -m unittest discover -s tests -p test_effect_launch_wrapper.py
          if ($LASTEXITCODE -ne 0) { throw 'Effect launch wrapper tests failed' }

      - name: Package and verify clean archive
        shell: pwsh
        env:
          SSEO_CHANNEL: dev
          SSEO_COMMIT: ${{ github.sha }}
        run: |
          python tools/fetch_proxy_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'Proxy runtime verification failed' }
          $name = "SHODAN-Stat-Editor-Offline-dev-" + $env:SSEO_COMMIT.Substring(0, 12)
          $env:SSEO_BUILT = (Get-Date).ToUniversalTime().ToString('yyyyMMdd-HHmmss')
          python offline/package.py $name
          if ($LASTEXITCODE -ne 0) { throw "package.py failed" }
          python tests/check_release_package.py "offline/release/$name.zip" --commit $env:SSEO_COMMIT --channel dev
          if ($LASTEXITCODE -ne 0) { throw "Release archive verification failed" }
          $hash = (Get-FileHash "offline/release/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content offline/release/SHA256SUMS.txt -Encoding ascii
          "ZIP=offline/release/$name.zip" >> $env:GITHUB_ENV

      - name: Keep the zip (ci/* branches)
        if: github.ref != 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: development-build
          path: |
            ${{ env.ZIP }}
            offline/release/SHA256SUMS.txt

      - name: Publish the Development build (dev)
        if: github.ref == 'refs/heads/dev'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          # Point the rolling tag at this build even if an orphaned tag existed.
          git tag -f dev $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Cannot set the development tag" }
          git push --force origin refs/tags/dev
          if ($LASTEXITCODE -ne 0) { throw "Cannot publish the development tag" }
          $base = "https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA"
          $notes = @(
            "Development build from dev: $env:GITHUB_SHA.",
            "",
            "Changes: [CHANGELOG]($base/CHANGELOG.md).",
            "Settings, parameter favorites, original backups and installation records live in Data beside the program. Keep Data, Presets and customized Names when updating.",
            "Upgrade and old-data migration: [portable data guide]($base/offline/PORTABLE_DATA.md).",
            "",
            "The source regression suite and clean-package audit passed. SHA256SUMS.txt verifies the attached ZIP."
          ) -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'shodan-development-notes.md'
          [IO.File]::WriteAllText($notesFile, $notes, [Text.UTF8Encoding]::new($false))
          gh release create dev $env:ZIP offline/release/SHA256SUMS.txt --prerelease --latest=false --target $env:GITHUB_SHA --title "Development build" --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "Cannot publish the development release" }
